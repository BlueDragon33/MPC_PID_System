name: MPC PID Live Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mpc-pid-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build standalone static web-app
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build -- --base=./

      - name: Detect GitHub Pages availability
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl --silent --output /tmp/pages.json --write-out '%{http_code}'             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/pages")"
          if [[ "$code" == "200" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is not enabled yet; dist artifact is preserved and local development continues."
          fi

      - name: Preserve development build
        uses: actions/upload-artifact@v4
        with:
          name: mpc-pid-standalone-site
          path: dist
          retention-days: 3

      - name: Configure Pages
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ steps.detect.outputs.enabled == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: ${{ needs.build.outputs.pages_enabled == 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy live
        id: deployment
        uses: actions/deploy-pages@v4
