name: MPC PID CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Control-core smoke test
        shell: bash
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee smoke.log

      - name: Solver and safety benchmark
        shell: bash
        run: |
          set -o pipefail
          npm run benchmark 2>&1 | tee benchmark.log

      - name: Upload research diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-diagnostics-${{ github.run_number }}
          path: |
            smoke.log
            benchmark.log
          if-no-files-found: ignore

      - name: Production build
        run: npm run build
