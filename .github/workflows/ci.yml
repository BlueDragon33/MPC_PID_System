name: MPC PID Development Fast CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpc-pid-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fast repository sanity
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f index.html
          test -d src
          test -d scripts
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          for file in scripts/*.mjs; do node --check "$file"; done
      - name: Development mode
        run: echo "Solver benchmarks, research diagnostics and production build are deferred during active development."
