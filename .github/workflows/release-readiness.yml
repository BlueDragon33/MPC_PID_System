name: MPC PID Release Readiness

on:
  pull_request:
    paths:
      - ".blueprint/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "public/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/release-readiness.yml"

permissions:
  contents: read

jobs:
  dependency-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check dependency lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve generated lock candidate
        if: ${{ steps.lock.outputs.present == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-candidate
          path: package-lock.json
          retention-days: 3
      - name: Require committed dependency lock
        if: ${{ steps.lock.outputs.present == 'false' }}
        shell: bash
        run: |
          echo "::error::package-lock.json is required for release readiness. A generated candidate was uploaded as an artifact."
          exit 1

  readiness:
    needs: dependency-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high
      - name: Architecture gate
        run: node scripts/architectureCheck.mjs
      - name: Source security gate
        run: node scripts/releaseSecurityScan.mjs
      - name: Orchestration contract gate
        run: node scripts/orchestrationContractSmoke.mjs
      - name: Presentation contract gate
        run: node scripts/presentationContractSmoke.mjs
      - name: Recovery contract gate
        run: node scripts/resilienceSmoke.mjs
      - name: Full control regression
        run: npm run smoke
      - name: Full research benchmark
        run: npm run benchmark
      - name: Build immutable standalone candidate
        run: npm run build -- --base=./
      - name: Generate exact-head release evidence
        env:
          RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_ROLLBACK_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/generateReleaseEvidence.mjs dist release-evidence.json
      - name: Verify artifact integrity evidence
        run: node scripts/verifyReleaseEvidence.mjs release-evidence.json dist
      - name: Browser online and offline candidate smoke
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo "::error::No Chromium-compatible browser is available on the runner."
            exit 1
          fi

          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/mpc-release-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.5
          done

          rm -rf /tmp/mpc-release-profile
          "$browser"             --headless             --no-sandbox             --disable-gpu             --user-data-dir=/tmp/mpc-release-profile             --virtual-time-budget=5000             --dump-dom             http://127.0.0.1:4173/ > /tmp/mpc-release-online.html

          grep -q 'MPC-PID Control System' /tmp/mpc-release-online.html

          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

          "$browser"             --headless             --no-sandbox             --disable-gpu             --user-data-dir=/tmp/mpc-release-profile             --virtual-time-budget=5000             --dump-dom             http://127.0.0.1:4173/ > /tmp/mpc-release-offline.html

          grep -q 'MPC-PID Control System' /tmp/mpc-release-offline.html
      - name: Preserve release-readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-${{ github.event.pull_request.head.sha }}
          path: |
            dist
            package-lock.json
            release-evidence.json
            .blueprint/release-readiness.json
            .blueprint/rollback-policy.json
          retention-days: 14
